name: Build Fabric Mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download Gradle 8.10.2
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
      - name: Build mod
        run: "$RUNNER_TEMP/gradle-8.10.2/bin/gradle" --no-daemon build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: hack-minecraft-fabric-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
